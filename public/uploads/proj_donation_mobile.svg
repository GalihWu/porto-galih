  <rect x="540" y="320" width="95" height="26" rx="4" fill="#38BDF8" stroke="#000" stroke-width="1.5"/>
  <text x="587" y="337" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">TypeScript</text>
