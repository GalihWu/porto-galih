<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F0EA"/>
  <defs>
    <pattern id="grid-mobile" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DACD" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-mobile)" />
  
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#38BDF8" stroke="#000000" stroke-width="4"/>
  <rect x="46" y="36" width="700" height="370" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  
  <rect x="46" y="36" width="700" height="48" rx="16" fill="#000000"/>
  <rect x="46" y="60" width="700" height="24" fill="#000000"/>
  <circle cx="76" cy="60" r="7" fill="#FF6B6B" stroke="#000" stroke-width="1.5"/>
  <circle cx="98" cy="60" r="7" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <circle cx="120" cy="60" r="7" fill="#4ECDC4" stroke="#000" stroke-width="1.5"/>
  <text x="710" y="66" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" text-anchor="end">REACT NATIVE • IN DEVELOPMENT</text>
  
  <g transform="translate(90, 115)">
    <rect x="0" y="0" width="190" height="230" rx="12" fill="#E0F2FE" stroke="#000000" stroke-width="3"/>
    <!-- Mobile Phone Mockup -->
    <rect x="65" y="35" width="60" height="95" rx="10" fill="#0284C7" stroke="#000" stroke-width="3"/>
    <rect x="73" y="45" width="44" height="68" rx="4" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
    <circle cx="95" cy="120" r="3" fill="#FFFFFF"/>
    <text x="95" y="152" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="17" text-anchor="middle">MOBILE APP</text>
    <text x="95" y="172" fill="#000000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">REACT NATIVE</text>
    <rect x="25" y="188" width="140" height="26" rx="6" fill="#FFD028" stroke="#000" stroke-width="2"/>
    <text x="95" y="206" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">⚡ IN DEVELOPMENT</text>
  </g>
  
  <text x="320" y="145" fill="#0284C7" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14">CROSS-PLATFORM MOBILE APPLICATION</text>
  <text x="320" y="185" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">Donation Mobile App</text>
  <text x="320" y="215" fill="#555555" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14">Aplikasi donasi online berbasis mobile dengan React Native &amp; NativeWind</text>
  
  <rect x="320" y="235" width="400" height="3" fill="#000000"/>
  
  <rect x="320" y="255" width="120" height="46" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="380" y="275" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">PLATFORM</text>
  <text x="380" y="293" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Android &amp; iOS</text>
  
  <rect x="455" y="255" width="120" height="46" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="515" y="275" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">STYLING</text>
  <text x="515" y="293" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">NativeWind</text>

  <rect x="590" y="255" width="120" height="46" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="650" y="275" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">LANGUAGE</text>
  <text x="650" y="293" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">TypeScript</text>
  
  <rect x="320" y="320" width="105" height="26" rx="4" fill="#38BDF8" stroke="#000" stroke-width="1.5"/>
