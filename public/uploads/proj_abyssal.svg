<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F0EA"/>
  <defs>
    <pattern id="grid-abyssal" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DACD" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-abyssal)" />
  
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#FF6B6B" stroke="#000000" stroke-width="4"/>
  <rect x="46" y="36" width="700" height="370" rx="16" fill="#111827" stroke="#000000" stroke-width="4"/>
  
  <rect x="46" y="36" width="700" height="48" rx="16" fill="#000000"/>
  <rect x="46" y="60" width="700" height="24" fill="#000000"/>
  <circle cx="76" cy="60" r="7" fill="#FF6B6B" stroke="#FFF" stroke-width="1.5"/>
  <circle cx="98" cy="60" r="7" fill="#FFD028" stroke="#FFF" stroke-width="1.5"/>
  <circle cx="120" cy="60" r="7" fill="#4ECDC4" stroke="#FFF" stroke-width="1.5"/>
  <text x="710" y="66" fill="#4ECDC4" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" text-anchor="end">WEBGL 3D INTERACTIVE • 60 FPS</text>
  
  <!-- Content Area -->
  <g transform="translate(90, 110)">
    <!-- 3D Poly Graphic Motif -->
    <polygon points="100,20 180,70 140,160 60,160 20,70" fill="#4ECDC4" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <polygon points="100,20 180,70 100,100" fill="#FFD028" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="180,70 140,160 100,100" fill="#FF6B6B" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="140,160 60,160 100,100" fill="#A78BFA" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="60,160 20,70 100,100" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="20,70 100,20 100,100" fill="#34D399" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  
  <text x="320" y="150" fill="#4ECDC4" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16">EVENT BOOTH MINI-GAME</text>
  <text x="320" y="195" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">Abyssal Echoes 3D Experience</text>
  
  <rect x="320" y="225" width="400" height="3" fill="#4ECDC4"/>
  
  <!-- Info Cards -->
  <rect x="320" y="245" width="180" height="50" rx="8" fill="#1F2937" stroke="#4ECDC4" stroke-width="2"/>
  <text x="335" y="267" fill="#9CA3AF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">PERFORMANCE TARGET</text>
  <text x="335" y="285" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14">60 FPS Constant (Mobile)</text>

  <rect x="520" y="245" width="180" height="50" rx="8" fill="#1F2937" stroke="#FFD028" stroke-width="2"/>
  <text x="535" y="267" fill="#9CA3AF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">ASSET BUNDLE SIZE</text>
  <text x="535" y="285" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14">&lt; 1.8 MB Total Gzip</text>

  <!-- Tags -->
  <rect x="320" y="315" width="85" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1"/>
  <text x="362" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Three.js</text>
  <rect x="415" y="315" width="85" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1"/>
  <text x="457" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Vue.js 3</text>
  <rect x="510" y="315" width="85" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1"/>
  <text x="552" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">WebGL 2.0</text>
</svg>
