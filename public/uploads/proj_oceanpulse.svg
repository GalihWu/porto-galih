<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F0EA"/>
  <!-- Decorative Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DACD" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)" />
  
  <!-- Brutalist Main Card -->
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#FFD028" stroke="#000000" stroke-width="4"/>
  <rect x="46" y="36" width="700" height="370" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  
  <!-- Top Bar -->
  <rect x="46" y="36" width="700" height="48" rx="16" fill="#000000"/>
  <rect x="46" y="60" width="700" height="24" fill="#000000"/>
  <circle cx="76" cy="60" r="7" fill="#FF6B6B" stroke="#000" stroke-width="1.5"/>
  <circle cx="98" cy="60" r="7" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <circle cx="120" cy="60" r="7" fill="#4ECDC4" stroke="#000" stroke-width="1.5"/>
  <text x="710" y="66" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" text-anchor="end">OCEANPULSE v2.4</text>
  
  <!-- Content Area -->
  <!-- Score Badge -->
  <rect x="90" y="120" width="190" height="220" rx="12" fill="#E6FAF0" stroke="#000000" stroke-width="3"/>
  <circle cx="185" cy="190" r="48" fill="#4ECDC4" stroke="#000" stroke-width="3"/>
  <text x="185" y="200" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34" text-anchor="middle">99</text>
  <text x="185" y="270" fill="#000000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">LIGHTHOUSE SCORE</text>
  <rect x="110" y="295" width="150" height="26" rx="6" fill="#FFD028" stroke="#000" stroke-width="2"/>
  <text x="185" y="312" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">CORE WEB VITALS PASSED</text>
  
  <!-- Right Details -->
  <text x="320" y="150" fill="#FF6B6B" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16">PERFORMANCE OPTIMIZATION</text>
  <text x="320" y="195" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">OceanPulse Performance Engine</text>
  
  <rect x="320" y="225" width="400" height="4" fill="#000000"/>
  
  <!-- Metric Pills -->
  <rect x="320" y="250" width="120" height="42" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="380" y="270" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">LCP (SPEED)</text>
  <text x="380" y="286" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">&lt; 0.9 Detik</text>
  
  <rect x="455" y="250" width="120" height="42" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="515" y="270" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">LOAD REDUCTION</text>
  <text x="515" y="286" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">40% – 60%</text>

  <rect x="590" y="250" width="120" height="42" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="650" y="270" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">CLS (STABILITY)</text>
  <text x="650" y="286" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">0.00 (Flawless)</text>
  
  <!-- Tech badges -->
  <rect x="320" y="315" width="80" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <text x="360" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">React.js</text>
  <rect x="410" y="315" width="95" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <text x="457" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">TypeScript</text>
  <rect x="515" y="315" width="95" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <text x="562" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">TailwindCSS</text>
</svg>
