<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F0EA"/>
  <defs>
    <pattern id="grid-beramal" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DACD" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-beramal)" />
  
  <!-- Brutalist Main Card -->
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#FFD028" stroke="#000000" stroke-width="4"/>
  <rect x="46" y="36" width="700" height="370" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  
  <!-- Top Bar -->
  <rect x="46" y="36" width="700" height="48" rx="16" fill="#000000"/>
  <rect x="46" y="60" width="700" height="24" fill="#000000"/>
  <circle cx="76" cy="60" r="7" fill="#FF6B6B" stroke="#000" stroke-width="1.5"/>
  <circle cx="98" cy="60" r="7" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <circle cx="120" cy="60" r="7" fill="#4ECDC4" stroke="#000" stroke-width="1.5"/>
  <text x="710" y="66" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" text-anchor="end">BERAMALBERSAMA.COM • PRODUCTION</text>
  
  <!-- Left Visual Badge -->
  <g transform="translate(90, 115)">
    <rect x="0" y="0" width="190" height="230" rx="12" fill="#E6FAF0" stroke="#000000" stroke-width="3"/>
    <!-- Heart / Donation Symbol -->
    <circle cx="95" cy="80" r="45" fill="#FF6B6B" stroke="#000" stroke-width="3"/>
    <path d="M95 98 C75 80, 65 65, 75 55 C83 47, 91 55, 95 62 C99 55, 107 47, 115 55 C125 65, 115 80, 95 98 Z" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
    <text x="95" y="152" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" text-anchor="middle">ONLINE DONATION</text>
    <text x="95" y="172" fill="#000000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">ASTRO + PWA APP</text>
    <rect x="25" y="188" width="140" height="26" rx="6" fill="#FFD028" stroke="#000" stroke-width="2"/>
    <text x="95" y="206" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">LIVE IN PRODUCTION</text>
  </g>
  
  <!-- Right Content Area -->
  <text x="320" y="145" fill="#FF6B6B" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14">WEB APPLICATION &amp; PWA</text>
  <text x="320" y="185" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">Beramalbersama Platform</text>
  <text x="320" y="215" fill="#555555" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14">Platform donasi online cepat dengan integrasi REST API &amp; PWA</text>
  
  <rect x="320" y="235" width="400" height="3" fill="#000000"/>
  
  <!-- Metric Pills -->
  <rect x="320" y="255" width="120" height="46" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="380" y="275" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">FRAMEWORK</text>
  <text x="380" y="293" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Astro Islands</text>
  
  <rect x="455" y="255" width="120" height="46" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="515" y="275" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">MOBILE ACCESS</text>
  <text x="515" y="293" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">PWA Installer</text>

  <rect x="590" y="255" width="120" height="46" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="650" y="275" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">STYLING</text>
  <text x="650" y="293" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">TailwindCSS</text>
  
  <!-- Tech badges -->
  <rect x="320" y="320" width="75" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <text x="357" y="337" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Astro</text>
  <rect x="405" y="320" width="95" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <text x="452" y="337" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">TailwindCSS</text>
  <rect x="510" y="320" width="75" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <text x="547" y="337" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">PWA</text>
  <rect x="595" y="320" width="85" height="26" rx="4" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <text x="637" y="337" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">REST API</text>
</svg>
