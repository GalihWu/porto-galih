<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#F4F0EA"/>
  <defs>
    <pattern id="grid-ui" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DACD" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-ui)" />
  
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#A78BFA" stroke="#000000" stroke-width="4"/>
  <rect x="46" y="36" width="700" height="370" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  
  <rect x="46" y="36" width="700" height="48" rx="16" fill="#000000"/>
  <rect x="46" y="60" width="700" height="24" fill="#000000"/>
  <circle cx="76" cy="60" r="7" fill="#FF6B6B" stroke="#000" stroke-width="1.5"/>
  <circle cx="98" cy="60" r="7" fill="#FFD028" stroke="#000" stroke-width="1.5"/>
  <circle cx="120" cy="60" r="7" fill="#4ECDC4" stroke="#000" stroke-width="1.5"/>
  <text x="710" y="66" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14" text-anchor="end">DESIGN SYSTEM &amp; ACCESSIBILITY</text>
  
  <!-- Content Area -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="190" height="220" rx="12" fill="#F3E8FF" stroke="#000000" stroke-width="3"/>
    <!-- UI Component Badges Mockup -->
    <rect x="25" y="25" width="140" height="35" rx="8" fill="#FFD028" stroke="#000" stroke-width="2"/>
    <text x="95" y="47" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle">&lt;Button /&gt;</text>
    
    <rect x="25" y="70" width="140" height="35" rx="8" fill="#FF6B6B" stroke="#000" stroke-width="2"/>
    <text x="95" y="92" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle">&lt;ModalDialog /&gt;</text>
    
    <rect x="25" y="115" width="140" height="35" rx="8" fill="#4ECDC4" stroke="#000" stroke-width="2"/>
    <text x="95" y="137" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" text-anchor="middle">&lt;InputCard /&gt;</text>

    <rect x="20" y="165" width="150" height="36" rx="6" fill="#000" stroke="#000" stroke-width="2"/>
    <text x="95" y="187" fill="#A78BFA" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">WCAG AAA COMPLIANT</text>
  </g>
  
  <text x="320" y="150" fill="#7C3AED" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16">COMPONENT LIBRARY</text>
  <text x="320" y="195" fill="#000000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">AquaUI Modular Design System</text>
  
  <rect x="320" y="225" width="400" height="4" fill="#000000"/>
  
  <rect x="320" y="250" width="180" height="45" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="335" y="268" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">COMPONENTS COUNT</text>
  <text x="335" y="285" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14">30+ Modular Widgets</text>

  <rect x="520" y="250" width="180" height="45" rx="8" fill="#F4F0EA" stroke="#000" stroke-width="2"/>
  <text x="535" y="268" fill="#666" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">BUNDLE FOOTPRINT</text>
  <text x="535" y="285" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="14">&lt; 15 KB Gzipped</text>

  <rect x="320" y="315" width="80" height="26" rx="4" fill="#A78BFA" stroke="#000" stroke-width="1.5"/>
  <text x="360" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Vue.js 3</text>
  <rect x="410" y="315" width="95" height="26" rx="4" fill="#A78BFA" stroke="#000" stroke-width="1.5"/>
  <text x="457" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">TailwindCSS</text>
  <rect x="515" y="315" width="95" height="26" rx="4" fill="#A78BFA" stroke="#000" stroke-width="1.5"/>
  <text x="562" y="332" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Storybook</text>
